// МОДУЛЬ: ЦЕНТР УПРАВЛЕНИЯ И АДМИН-ПАНЕЛЬ (СУПЕРАДМИНИСТРАТОР)
// ТЕСТОВЫЙ РЕЖИМ С ПОЛЕМ МАСТЕР-ПИНА БЕЗ БЛОКИРОВОК (ДОСТУП В 1 КЛИК)
// ============================================================================

function AdminCenterView({
  staffMembers,
  setStaffMembers,
  onSelectRole,
  roles,
  wikiData,
  onOpenDetailedManual,
  campStartDate,
  setCampStartDate,
  showToast
}) {
  const [adminTab, setAdminTab] = useState('staff'); // 'staff' | 'rbac' | 'artifacts' | 'settings'
  const [masterPin, setMasterPin] = useState('7777');
  const [staffFilter, setStaffFilter] = useState('all');
  const [staffSearch, setStaffSearch] = useState('');
  
  // State for Add / Edit Employee modal/form
  const [editingEmployee, setEditingEmployee] = useState(null); // null or employee object
  const [isAddingEmployee, setIsAddingEmployee] = useState(false);
  const [employeeFormData, setEmployeeFormData] = useState({
    id: '',
    name: '',
    roleId: 'mentors',
    roleTitle: 'Наставник команды',
    teamNumber: 1,
    teamName: 'Команда 1',
    track: 'pedagogy',
    trackName: 'Педагогический корпус',
    phone: '+7 (701) 000-00-00',
    avatar: '🦁',
    rating: 95,
    energyLevel: 5,
    status: 'active',
    currentActivity: 'Проведение утренней настройки команды'
  });

  // State for Artifacts Editing
  const [artifactSearch, setArtifactSearch] = useState('');
  const [editingArtifactName, setEditingArtifactName] = useState(null);
  const [artifactEditContent, setArtifactEditContent] = useState(null);

  // Dynamic list of artifacts from DETAILED_ARTIFACTS_MANUALS or wikiData
  const allArtifactNames = typeof DETAILED_ARTIFACTS_MANUALS !== 'undefined'
    ? Object.keys(DETAILED_ARTIFACTS_MANUALS)
    : (wikiData.artifactsCatalog || []).map(a => a.name);

  // Filter staff
  const staffList = staffMembers || (typeof CAMP_STAFF_MEMBERS !== 'undefined' ? CAMP_STAFF_MEMBERS : []);
  let filteredStaff = staffList;
  if (staffFilter !== 'all') {
    filteredStaff = filteredStaff.filter(s => s.track === staffFilter || s.status === staffFilter);
  }
  if (staffSearch.trim()) {
    const q = staffSearch.toLowerCase();
    filteredStaff = filteredStaff.filter(s => 
      s.name.toLowerCase().includes(q) || 
      s.roleTitle.toLowerCase().includes(q) || 
      (s.teamName && s.teamName.toLowerCase().includes(q))
    );
  }

  // Handle Save / Add Employee
  const handleSaveEmployee = (e) => {
    e.preventDefault();
    if (!employeeFormData.name.trim()) {
      if (showToast) showToast('⚠️ Укажите ФИО сотрудника');
      return;
    }

    if (isAddingEmployee) {
      const newEmp = {
        ...employeeFormData,
        id: `emp_${Date.now()}`,
        tasksStats: { total: 10, done: 6, inProgress: 4, overdue: 0 },
        strengths: ['Высокая эмпатия к воспитанникам', 'Дисциплина чести'],
        weaknesses: ['Требуется контроль своевременной сдачи вечернего отчета']
      };
      const updated = [newEmp, ...staffList];
      setStaffMembers(updated);
      try {
        localStorage.setItem('zhana_urpaq_staff_members_v5', JSON.stringify(updated));
      } catch (err) {}
      if (showToast) showToast(`✓ Новый сотрудник [${newEmp.name}] добавлен в штат!`);
      setIsAddingEmployee(false);
    } else if (editingEmployee) {
      const updated = staffList.map(s => s.id === editingEmployee.id ? { ...s, ...employeeFormData } : s);
      setStaffMembers(updated);
      try {
        localStorage.setItem('zhana_urpaq_staff_members_v5', JSON.stringify(updated));
      } catch (err) {}
      if (showToast) showToast(`✓ Данные сотрудника [${employeeFormData.name}] обновлены!`);
      setEditingEmployee(null);
    }
  };

  const handleDeleteEmployee = (empId, empName) => {
    if (window.confirm(`Вы уверены, что хотите удалить сотрудника «${empName}» из активного штата смены?`)) {
      const updated = staffList.filter(s => s.id !== empId);
      setStaffMembers(updated);
      try {
        localStorage.setItem('zhana_urpaq_staff_members_v5', JSON.stringify(updated));
      } catch (err) {}
      if (showToast) showToast(`Сотрудник [${empName}] удален из штата.`);
    }
  };

  const handleStartEditEmployee = (emp) => {
    setEditingEmployee(emp);
    setIsAddingEmployee(false);
    setEmployeeFormData({
      id: emp.id,
      name: emp.name,
      roleId: emp.roleId || 'mentors',
      roleTitle: emp.roleTitle,
      teamNumber: emp.teamNumber || 1,
      teamName: emp.teamName || `Команда ${emp.teamNumber || 1}`,
      track: emp.track || 'pedagogy',
      trackName: emp.trackName || 'Педагогический корпус',
      phone: emp.phone || '+7 (701) 000-00-00',
      avatar: emp.avatar || '👤',
      rating: emp.rating || 95,
      energyLevel: emp.energyLevel || 5,
      status: emp.status || 'active',
      currentActivity: emp.currentActivity || 'Работа с командой'
    });
  };

  const handleStartAddEmployee = () => {
    setIsAddingEmployee(true);
    setEditingEmployee(null);
    setEmployeeFormData({
      id: '',
      name: '',
      roleId: 'mentors',
      roleTitle: 'Наставник команды',
      teamNumber: 1,
      teamName: 'Команда 1',
      track: 'pedagogy',
      trackName: 'Педагогический корпус',
      phone: '+7 (701) 777-88-99',
      avatar: '🦁',
      rating: 95,
      energyLevel: 5,
      status: 'active',
      currentActivity: 'Адаптация воспитанников в День 1'
    });
  };

  // Artifact Editing
  const handleStartEditArtifact = (artName) => {
    const currentManual = (typeof DETAILED_ARTIFACTS_MANUALS !== 'undefined' && DETAILED_ARTIFACTS_MANUALS[artName]) || {
      title: artName,
      targetAudience: 'Команда образовательного лагеря Жаңа Ұрпақ',
      summary: 'Официальный регламент смены.',
      sections: [
        { heading: '1. Назначение', content: 'Цели и порядок применения артефакта.' }
      ]
    };
    setEditingArtifactName(artName);
    setArtifactEditContent(JSON.parse(JSON.stringify(currentManual)));
  };

  const handleSaveArtifactChanges = () => {
    if (typeof DETAILED_ARTIFACTS_MANUALS !== 'undefined' && editingArtifactName && artifactEditContent) {
      DETAILED_ARTIFACTS_MANUALS[editingArtifactName] = artifactEditContent;
      try {
        localStorage.setItem(`zhana_urpaq_art_custom_${editingArtifactName}`, JSON.stringify(artifactEditContent));
      } catch (e) {}
      if (showToast) showToast(`✓ Регламент «${editingArtifactName}» сохранен!`);
      setEditingArtifactName(null);
      setArtifactEditContent(null);
    }
  };

  // Full Config Export / Import
  const handleExportFullConfig = () => {
    const configData = {
      appName: 'Jana Urpaq OS 360°',
      exportDate: new Date().toISOString(),
      staffMembers: staffList,
      campStartDate: campStartDate || '2026-06-15'
    };
    const blob = new Blob([JSON.stringify(configData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `jana_urpaq_config_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if (showToast) showToast('✓ Полная конфигурация системы успешно скачана в JSON!');
  };

  const handleResetToDefaults = () => {
    if (window.confirm('Сбросить весь штат и настройки к заводским стандартам по умолчанию?')) {
      try {
        localStorage.removeItem('zhana_urpaq_staff_members_v5');
      } catch (e) {}
      if (typeof CAMP_STAFF_MEMBERS !== 'undefined') {
        setStaffMembers(CAMP_STAFF_MEMBERS);
      }
      if (showToast) showToast('✓ База сотрудников сброшена к заводским стандартам 32 специалистов!');
    }
  };

  return (
    <div className="py-6 sm:py-8 space-y-6 animate-fadeIn">
      
      {/* ======================================================== */}
      {/* 1. TOP ADMIN HERO BANNER WITH MASTER-PIN FIELD */}
      {/* ======================================================== */}
      <div className="bg-gradient-to-r from-purple-950 via-slate-900 to-red-950 text-white rounded-3xl p-6 sm:p-8 border border-purple-500/40 shadow-xl flex flex-col lg:flex-row lg:items-center justify-between gap-6">
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <span className="px-3 py-1 rounded-full bg-amber-400 text-slate-950 text-xs font-black uppercase tracking-wider flex items-center gap-1.5 shadow-sm">
              <span>👑</span>
              <span>Центр управления лагерем</span>
            </span>
            <span className="px-3 py-1 rounded-full bg-purple-900/80 text-purple-200 border border-purple-400/40 text-xs font-extrabold flex items-center gap-1">
              <span>🟢</span>
              <span>Тестовый режим (Доступ в 1 клик)</span>
            </span>
          </div>

          <h1 className="text-2xl sm:text-3xl font-black font-serif text-white mb-2">
            Панель Администратора & Управление Правами
          </h1>
          <p className="text-xs sm:text-sm text-purple-200/90 max-w-2xl leading-relaxed">
            Здесь вы можете видеть весь лагерь глазами любого из 32 сотрудников, управлять составом команды, настраивать регламенты и тестировать разделение прав доступа без ограничений.
          </p>
        </div>

        {/* Master PIN Widget (Тестовый режим без блокировок) */}
        <div className="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 shrink-0 space-y-2 min-w-[240px]">
          <div className="flex items-center justify-between text-xs">
            <span className="font-extrabold text-amber-300">Мастер-ПИН (Суперадмин):</span>
            <span className="text-[10px] bg-emerald-500/30 text-emerald-300 px-1.5 py-0.5 rounded font-mono font-bold">Активен</span>
          </div>

          <div className="flex items-center gap-2">
            <input
              type="text"
              value={masterPin}
              onChange={(e) => setMasterPin(e.target.value)}
              className="w-28 bg-slate-900/90 text-amber-300 font-mono text-center font-black tracking-widest text-sm py-1.5 px-3 rounded-xl border border-amber-400/60 focus:outline-none focus:ring-2 focus:ring-amber-400"
              placeholder="7777"
            />
            <span className="text-[11px] text-purple-200 font-medium leading-tight">
              Пароль не требуется для теста
            </span>
          </div>

          <div className="text-[10px] text-slate-300 pt-1 border-t border-white/10 flex items-center gap-1">
            <span>🛡️</span>
            <span>Полный режим управляющего</span>
          </div>
        </div>
      </div>

      {/* ======================================================== */}
      {/* 2. ADMIN NAVIGATION TABS */}
      {/* ======================================================== */}
      <div className="flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar">
        {[
          { id: 'staff', label: `Команда & Кадры (${staffList.length})`, icon: '👥' },
          { id: 'rbac', label: 'Модель прав доступа (RBAC)', icon: '🔐' },
          { id: 'artifacts', label: `Редактор артефактов (${allArtifactNames.length})`, icon: '📖' },
          { id: 'settings', label: 'Настройки смены & Экспорт', icon: '🛠️' }
        ].map(tab => (
          <button
            key={tab.id}
            onClick={() => setAdminTab(tab.id)}
            className={`flex items-center gap-2 px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold transition-all whitespace-nowrap border ${
              adminTab === tab.id
                ? 'bg-purple-900 text-amber-300 border-purple-900 shadow-md ring-2 ring-amber-400/30'
                : 'bg-white text-slate-700 hover:bg-slate-50 border-slate-200'
            }`}
          >
            <span>{tab.icon}</span>
            <span>{tab.label}</span>
          </button>
        ))}
      </div>

      {/* ======================================================== */}
      {/* TAB 1: УПРАВЛЕНИЕ КАДРАМИ И СОТРУДНИКАМИ */}
      {/* ======================================================== */}
      {adminTab === 'staff' && (
        <div className="space-y-5 animate-fadeIn">
          
          {/* Controls Bar */}
          <div className="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-center gap-2 flex-wrap flex-1">
              <input
                type="text"
                value={staffSearch}
                onChange={(e) => setStaffSearch(e.target.value)}
                placeholder="Поиск по ФИО, должности, команде..."
                className="text-xs p-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 w-full sm:w-64"
              />

              <div className="flex items-center gap-1 overflow-x-auto">
                {[
                  { id: 'all', label: 'Все' },
                  { id: 'pedagogy', label: 'Наставники' },
                  { id: 'training', label: 'Тренеры' },
                  { id: 'care', label: 'Забота' },
                  { id: 'strategic', label: 'Штаб' }
                ].map(f => (
                  <button
                    key={f.id}
                    onClick={() => setStaffFilter(f.id)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                      staffFilter === f.id
                        ? 'bg-slate-900 text-white border-slate-900'
                        : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                    }`}
                  >
                    {f.label}
                  </button>
                ))}
              </div>
            </div>

            <button
              onClick={handleStartAddEmployee}
              className="px-4 py-2.5 rounded-xl bg-purple-900 hover:bg-purple-800 text-amber-300 font-black text-xs shadow-md transition-all flex items-center justify-center gap-1.5 shrink-0"
            >
              <span>+</span>
              <span>Добавить сотрудника</span>
            </button>
          </div>

          {/* Form / Modal for Adding/Editing Employee */}
          {(isAddingEmployee || editingEmployee) && (
            <div className="bg-purple-50/80 p-5 sm:p-6 rounded-3xl border-2 border-purple-300 shadow-md space-y-4 animate-scaleUp">
              <div className="flex items-center justify-between border-b border-purple-200 pb-3">
                <h3 className="text-base font-black text-purple-950 font-serif flex items-center gap-2">
                  <span>{isAddingEmployee ? '➕' : '✏️'}</span>
                  <span>{isAddingEmployee ? 'Новый сотрудник в штат' : `Редактирование: ${employeeFormData.name}`}</span>
                </h3>
                <button
                  onClick={() => { setIsAddingEmployee(false); setEditingEmployee(null); }}
                  className="w-7 h-7 rounded-full bg-white text-slate-700 font-bold flex items-center justify-center hover:bg-slate-100 shadow-xs text-xs"
                >
                  ✕
                </button>
              </div>

              <form onSubmit={handleSaveEmployee} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 text-xs">
                <div>
                  <label className="font-extrabold text-slate-800 block mb-1">ФИО сотрудника:</label>
                  <input
                    type="text"
                    required
                    value={employeeFormData.name}
                    onChange={(e) => setEmployeeFormData({ ...employeeFormData, name: e.target.value })}
                    placeholder="Например: Арман Сериков"
                    className="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-bold"
                  />
                </div>

                <div>
                  <label className="font-extrabold text-slate-800 block mb-1">Должность / Роль:</label>
                  <input

                    value={employeeFormData.roleTitle}
                    onChange={(e) => setEmployeeFormData({ ...employeeFormData, roleTitle: e.target.value })}

                  <input

                    className="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-bold"
                  />
                </div>

                <div>
                  <label className="font-extrabold text-slate-800 block mb-1">Контактный телефон:</label>
                  <input
                    type="text"
                    value={employeeFormData.phone}
                    onChange={(e) => setEmployeeFormData({ ...employeeFormData, phone: e.target.value })}

                    className="w-full p-2.5 rounded-xl border border-slate-300 bg-white"
                  />

                  <label className="font-extrabold text-slate-800 block mb-1">Аватар (эмодзи):</label>
                  <input

function ShiftsArchiveView({
  shiftsArchive,
  currentTasks,
  currentStaffMembers,
  currentReportsState,
  onCompleteShiftAndArchive,
  onDeleteArchivedShift,
  onExportArchiveJson,
  onImportArchiveJson,
  onOpenPostCampReport,
  onOpenEmployeeDossier,
  showToast
}) {
  const [selectedShiftForDetails, setSelectedShiftForDetails] = useState(null);
  const [isFinishModalOpen, setIsFinishModalOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');

  // Finish shift form state
  const [shiftNumber, setShiftNumber] = useState('14');
  const [shiftName, setShiftName] = useState('Смена №14: Сила Единства');
  const [shiftDates, setShiftDates] = useState('15.07.2026 — 22.07.2026');
  const [shiftLocation, setShiftLocation] = useState('База «Тау-Туран», Алматы');
  const [shiftNotes, setShiftNotes] = useState('Успешное завершение смены. Все нормативы Книги ЖУ выполнены.');

  const handleFinishAndArchiveSubmit = () => {
    const totalStaff = currentStaffMembers.length;
    const avgRating = totalStaff > 0 ? Math.round(currentStaffMembers.reduce((acc, s) => acc + s.rating, 0) / totalStaff) : 95;
    const doneTasks = currentTasks.filter(t => t.status === 'Готово').length;
    const totalTasks = currentTasks.length;
    const completionRate = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

    const snapshot = {
      id: `shift-archive-${Date.now()}`,
      shiftNumber: parseInt(shiftNumber, 10) || 14,
      name: shiftName,
      dates: shiftDates,
      location: shiftLocation,
      archivedAt: new Date().toISOString(),
      stats: {
        totalStaff,
        avgRating,
        totalTasks,
        doneTasks,
        completionRate,
        avgHappiness: 4.89,
        incidentsCount: 0
      },
      topPerformers: [...currentStaffMembers].sort((a, b) => b.rating - a.rating).slice(0, 5).map(s => ({
        name: s.name,
        role: s.roleTitle,
        rating: s.rating
      })),
      summaryText: shiftNotes,
      conclusions: [
        'Все 12 команд завершили программу и прошли итоговую инициацию.',
        'Отчеты руководителей и наставников сохранены в долговременный архив.',
        'Мастер-план выполнен с соблюдением всех протоколов безопасности.'
      ],
      staffSnapshot: currentStaffMembers,
      tasksSnapshot: currentTasks,
      reportsSnapshot: currentReportsState
    };

    onCompleteShiftAndArchive(snapshot);
    setIsFinishModalOpen(false);
    if (showToast) {
      showToast('🎉 Смена успешно завершена и запечатана в «Архив смен»!');
    }
  };

  const filteredShifts = shiftsArchive.filter(s => {
    if (!searchQuery.trim()) return true;
    const q = searchQuery.toLowerCase();
    return s.name.toLowerCase().includes(q) || s.dates.toLowerCase().includes(q) || s.location.toLowerCase().includes(q);
  });

    <div className="py-6 space-y-8 animate-fadeIn">
      
      {/* Archive Header Banner */}

                  type="text"

                  onChange={e => setShiftName(e.target.value)}

                  placeholder="Например: Смена №14 (Август 2026)"

              <div>
                <label className="font-extrabold text-slate-800 block mb-1">Даты проведения смены:</label>
                <input
                  type="text"
                  value={shiftDates}
                  onChange={e => setShiftDates(e.target.value)}
                  className="w-full p-2.5 rounded-xl border border-slate-300 font-bold bg-slate-50"
                  placeholder="Например: 15.07.2026 — 22.07.2026"
                />
              </div>

              <div>
                <label className="font-extrabold text-slate-800 block mb-1">Локация / База:</label>
                <input
                  type="text"
                  value={shiftLocation}

                  placeholder="База «Тау-Туран», Алматы"
                />
              </div>

              <div>
                <label className="font-extrabold text-slate-800 block mb-1">Главный вывод и итог смены:</label>
                <textarea
                  rows="2"

                  onChange={e => setShiftNotes(e.target.value)}

            <div className="pt-2 border-t border-slate-100 flex items-center justify-between gap-3">
              <button
                type="button"
                onClick={() => setIsFinishModalOpen(false)}

              >
                Отмена
              </button>

              <button
                type="button"
                onClick={handleFinishAndArchiveSubmit}
                className="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs shadow-md transition-all flex items-center gap-1.5"
              >
                <span>📦</span>
                <span>Запечатать в архив и начать новую</span>
              </button>
            </div>

          </div>
        </div>
      )}

    </div>
  );
}



    function App() {
      // 1. Camp Start Date Setting
      const [campStartDate, setCampStartDate] = useState(() => {
        return localStorage.getItem('zhana_urpaq_camp_start_date') || '2026-06-15';
      });

      // 2. Tasks state (Master Plan)
      const [tasks, setTasks] = useState(() => {
        try {
          const saved = localStorage.getItem('zhana_urpaq_tasks_v4');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error(e);
        }
        return TASKS_DATA;
      });

      // 3. Participants state (ИПР)
      const [participants, setParticipants] = useState(() => {
        try {
          const saved = localStorage.getItem('zhana_urpaq_participants_v4');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error(e);
        }
        return INITIAL_PARTICIPANTS;
      });

      // 4. Operational SLA Reports state (Hierarchical Subordination)
      const [reportsState, setReportsState] = useState(() => {
        try {
          const saved = localStorage.getItem('zhana_urpaq_reports_state_v4');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return {
          rep_psychologist_screening: { 
            status: 'overdue', 
            submittedAt: null, 
            notes: 'Тревожность в семье Ахметовых (Точка А)',
            explanation: 'Психолог находился на индивидуальной сессии с ребенком до 23:00'
          },
          rep_mentor_compass: {
            status: 'pending_review',
            submittedAt: new Date().toISOString(),
            param1: '5',
            param2: 'Команда прошла практику «Плед». Энергия на высоте.'
          }
        };
      });

      // 5. RTO Targets state
      const [rtoTargets, setRtoTargets] = useState(() => {
        try {
          const saved = localStorage.getItem('zhana_urpaq_rto_targets_v4');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return INITIAL_RTO_TARGETS;
      });

      // 6. Parent Anxiety state
      const [parentAnxiety, setParentAnxiety] = useState(() => {
        try {
          const saved = localStorage.getItem('zhana_urpaq_parent_anxiety_v4');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return INITIAL_PARENT_ANXIETY;
      });

      // 7. Pulse of the week
      const [pulseWeek, setPulseWeek] = useState(() => {
        try {
          const saved = localStorage.getItem('zhana_urpaq_pulse_week_v4');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return INITIAL_PULSE_WEEK;
      });

      // 8. Start-Stop-Continue debrief
      const [startStopContinue, setStartStopContinue] = useState(() => {
        try {
          const saved = localStorage.getItem('zhana_urpaq_ssc_v4');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return INITIAL_START_STOP_CONTINUE;
      });

      // Navigation & active tracks
      const [currentView, setCurrentView] = useState(() => localStorage.getItem('zhana_urpaq_view') || 'portal');
      const [activeTrack, setActiveTrack] = useState(() => localStorage.getItem('zhana_urpaq_track') || 'awakening');
      const [selectedRoleId, setSelectedRoleId] = useState(() => localStorage.getItem('zhana_urpaq_role') || 'founder');

      // Modals
      const [instructionTask, setInstructionTask] = useState(null);
      const [artifactData, setArtifactData] = useState(null);
      const [crisisData, setCrisisData] = useState(null);
      const [brandedDocData, setBrandedDocData] = useState(null);
      const [isReportOpen, setIsReportOpen] = useState(false);
      const [isExportOpen, setIsExportOpen] = useState(false);
      const [isTrainingScheduleOpen, setIsTrainingScheduleOpen] = useState(false);
      const [isChecklistOpen, setIsChecklistOpen] = useState(false);
      const [isPlaceholdersOpen, setIsPlaceholdersOpen] = useState(false);
      const [selectedChildForCheckin, setSelectedChildForCheckin] = useState(null);
      const [selectedChildForIprGen, setSelectedChildForIprGen] = useState(null);
      const [selectedChildForIprPrint, setSelectedChildForIprPrint] = useState(null);
      const [selectedReportForForm, setSelectedReportForForm] = useState(null);
      const [staffMembers, setStaffMembers] = useState(() => {
        try {
          const saved = localStorage.getItem('zhana_urpaq_staff_members_v5');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error(e);
        }
        return typeof CAMP_STAFF_MEMBERS !== 'undefined' ? CAMP_STAFF_MEMBERS : [];
      });
      const [selectedEmployeeForDossier, setSelectedEmployeeForDossier] = useState(null);
      const [selectedArtifactForDetailedManual, setSelectedArtifactForDetailedManual] = useState(null);
            const [isPostCampReportOpen, setIsPostCampReportOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      // 4.2. Постоянное хранилище «Архив смен» (localStorage: zhana_urpaq_shifts_archive)
      const [shiftsArchive, setShiftsArchive] = useState(() => {
        try {
          const saved = localStorage.getItem('zhana_urpaq_shifts_archive');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return INITIAL_ARCHIVED_SHIFTS;
      });

      useEffect(() => {
        try {
          localStorage.setItem('zhana_urpaq_shifts_archive', JSON.stringify(shiftsArchive));
        } catch (e) {
          console.error(e);
        }
      }, [shiftsArchive]);

      useEffect(() => {
        window.__openDetailedManualGlobal = (art) => setSelectedArtifactForDetailedManual(art);
      }, []);

      const handleCompleteShiftAndArchive = (snapshot) => {
        setShiftsArchive(prev => [snapshot, ...prev]);
        handleResetTasks();
        setReportsState({});
      };

      const handleDeleteArchivedShift = (shiftId) => {
        setShiftsArchive(prev => prev.filter(s => s.id !== shiftId));
        showToast('Смена удалена из архива');
      };

      const handleExportArchiveJson = () => {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(shiftsArchive, null, 2));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = `zhana_urpaq_shifts_archive_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Архив смен успешно выгружен в JSON!');
      };

      const handleImportArchiveJson = (importedList) => {
        if (Array.isArray(importedList)) {
          setShiftsArchive(importedList);
          showToast('Архив смен успешно загружен из JSON!');
        }
      };


      // Persistence
      useEffect(() => {
        try { localStorage.setItem('zhana_urpaq_tasks_v4', JSON.stringify(tasks)); } catch (e) { console.error(e); }
      }, [tasks]);

      useEffect(() => {
        try { localStorage.setItem('zhana_urpaq_participants_v4', JSON.stringify(participants)); } catch (e) { console.error(e); }
      }, [participants]);

      useEffect(() => {
        try { localStorage.setItem('zhana_urpaq_reports_state_v4', JSON.stringify(reportsState)); } catch (e) { console.error(e); }
      }, [reportsState]);

      useEffect(() => {
        try { localStorage.setItem('zhana_urpaq_rto_targets_v4', JSON.stringify(rtoTargets)); } catch (e) { console.error(e); }
      }, [rtoTargets]);

      useEffect(() => {
        localStorage.setItem('zhana_urpaq_camp_start_date', campStartDate);
      }, [campStartDate]);

      useEffect(() => {
        localStorage.setItem('zhana_urpaq_view', currentView);
      }, [currentView]);

      useEffect(() => {
        localStorage.setItem('zhana_urpaq_role', selectedRoleId);
      }, [selectedRoleId]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      // 1-Click Backup Download
      const handleDownloadBackupHtml = () => {
        const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Jana_Urpaq_OS_backup.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Локальный бэкап успешно скачан в папку загрузок!');
      };

      const handleUpdateTaskStatus = (taskId, newStatus) => {
        setTasks(prev => prev.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
        if (instructionTask && instructionTask.id === taskId) {
          setInstructionTask(prev => ({ ...prev, status: newStatus }));
        }
        showToast(`Статус задачи ${taskId} изменен на «${newStatus}»`);
      };

      const handleUpdateTaskNote = (taskId, newNote) => {
        setTasks(prev => prev.map(t => t.id === taskId ? { ...t, note: newNote } : t));
      };

      // Check-in save for child
      const handleSaveCheckin = (childId, day, checkinData) => {
        setParticipants(prev => prev.map(ch => {
          if (ch.id === childId) {
            return {
              ...ch,
              dailyCheckins: {
                ...(ch.dailyCheckins || {}),
                [day]: checkinData
              }
            };
          }
          return ch;
        }));
        showToast(`Чекин дня ${day} сохранен!`);
      };

      // IPR draft save
      const handleSaveIprData = (childId, iprData) => {
        setParticipants(prev => prev.map(ch => {
          if (ch.id === childId) {
            return { ...ch, iprData };
          }
          return ch;
        }));
        showToast('Проект ИПР сохранен!');
      };

      // Submit IPR to review
      const handleSubmitIprForReview = (childId) => {
        setParticipants(prev => prev.map(ch => {
          if (ch.id === childId) {
            return { ...ch, iprStatus: 'review' };
          }
          return ch;
        }));
        showToast('ИПР подписан и отправлен Старшему наставнику!');
      };

      // Approve IPR by Senior Mentor
      const handleApproveIpr = (childId) => {
        setParticipants(prev => prev.map(ch => {
          if (ch.id === childId) {
            return { ...ch, iprStatus: 'approved' };
          }
          return ch;
        }));
        showToast('ИПР успешно утвержден Старшим наставником!');
      };

      // Save SLA report (Subordinate submission)
      const handleSaveReport = (reportId, reportData) => {
        setReportsState(prev => ({
          ...prev,
          [reportId]: {
            ...(prev[reportId] || {}),
            ...reportData
          }
        }));
        if (reportData.escalatedToFounder) {
          showToast('⚠️ Просроченный отчет с объяснительной эскалирован Основателю!');
        } else {
          showToast('Отчет успешно передан на проверку руководителю!');
        }
      };

      // Supervisor approves subordinate report
      const handleApproveReport = (reportId) => {
        setReportsState(prev => ({
          ...prev,
          [reportId]: {
            ...(prev[reportId] || {}),
            status: 'approved',
            reviewedAt: new Date().toISOString()
          }
        }));
        showToast('✅ Отчет подчиненного утвержден!');
      };

      // Supervisor returns subordinate report for revision
      const handleReturnReport = (reportId, comment) => {
        setReportsState(prev => ({
          ...prev,
          [reportId]: {
            ...(prev[reportId] || {}),
            status: 'returned',
            supervisorComment: comment,
            reviewedAt: new Date().toISOString()
          }
        }));
        showToast('↩️ Отчет возвращен подчиненному на доработку!');
      };

      const handleResetTasks = () => {
        setTasks(TASKS_DATA);
        setParticipants(INITIAL_PARTICIPANTS);
        setRtoTargets(INITIAL_RTO_TARGETS);
        showToast('Данные сброшены в исходное состояние смены');
      };

      const handleImportData = (imported) => {
        if (Array.isArray(imported)) {
          setTasks(imported);
        } else {
          if (imported.tasks) setTasks(imported.tasks);
          if (imported.participants) setParticipants(imported.participants);
          if (imported.reportsState) setReportsState(imported.reportsState);
          if (imported.rtoTargets) setRtoTargets(imported.rtoTargets);
        }
        showToast('Данные успешно импортированы!');
      };

      const overdueReportsCount = REPORTS_SLA_CONFIG.filter(r => (reportsState[r.id] && (reportsState[r.id].status === 'overdue' || reportsState[r.id].status === 'escalated')) || (!reportsState[r.id] && r.defaultStatus === 'overdue')).length;
      const redFlagsCount = tasks.filter(t => !t.isAutonomousCRM && t.status === 'Проблема').length + overdueReportsCount;
      const currentRole = ROLES.find(r => r.id === selectedRoleId) || ROLES[0];

      return (
        <div className="min-h-screen bg-[#F8FAFC] text-slate-900 flex flex-col font-sans selection:bg-amber-200 selection:text-amber-950">
          
          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl border border-amber-400/50 text-xs font-bold flex items-center gap-2 animate-bounce no-print">
              <span>✨</span>
              <span>{toastMessage}</span>
            </div>
          )}

          <Header
            currentView={currentView}
            setCurrentView={setCurrentView}
            selectedRoleId={selectedRoleId}
            setSelectedRoleId={setSelectedRoleId}
            roles={ROLES}
            reportsConfig={REPORTS_SLA_CONFIG}
            reportsState={reportsState}
            redFlagsCount={redFlagsCount}
            campStartDate={campStartDate}
            onOpenReport={(rep) => setSelectedReportForForm(rep || REPORTS_SLA_CONFIG[0])}
            onOpenExport={() => setIsExportOpen(true)}
            onOpenChecklists={() => setIsChecklistOpen(true)}
            onOpenPlaceholders={() => setIsPlaceholdersOpen(true)}
            onDownloadBackup={handleDownloadBackupHtml}
          />

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pb-16">
            
            {/* 1. PORTAL VIEW */}
            {currentView === 'portal' && (
              <PortalView
                tasks={tasks}
                roles={ROLES}
                activeTrack={activeTrack}
                setActiveTrack={setActiveTrack}
                onSelectRole={(roleId) => {
                  setSelectedRoleId(roleId);
                  setCurrentView('workspace');
                }}
                onGoToDashboard={() => setCurrentView('dashboard')}
                onGoToRoles={() => setCurrentView('roles')}
                onGoToWiki={() => setCurrentView('wiki')}
                onOpenEveningReport={() => setSelectedReportForForm(REPORTS_SLA_CONFIG.find(r => r.id === 'rep_mentor_compass') || REPORTS_SLA_CONFIG[0])}
                onOpenTrainingSchedule={() => setIsTrainingScheduleOpen(true)}
                onOpenBrandedDoc={(doc) => setBrandedDocData(doc)}
                onDownloadBackup={handleDownloadBackupHtml}
              />
            )}

            {/* 2. EXECUTIVE DASHBOARD */}
            {currentView === 'dashboard' && (
              <ExecutiveDashboard
                tasks={tasks}
                roles={ROLES}
                reportsConfig={REPORTS_SLA_CONFIG}
                reportsState={reportsState}
                campStartDate={campStartDate}
                onUpdateStatus={handleUpdateTaskStatus}
                onOpenInstruction={setInstructionTask}
                onOpenArtifact={setArtifactData}
                onSelectRole={(roleId) => {
                  setSelectedRoleId(roleId);
                  setCurrentView('workspace');
                }}
                onOpenReportForm={setSelectedReportForForm}
                onOpenBrandedDoc={(doc) => setBrandedDocData(doc)}
                onOpenChecklists={() => setIsChecklistOpen(true)}
                staffMembers={staffMembers}
                onOpenPostCampReport={() => setIsPostCampReportOpen(true)}
                onOpenEmployeeDossier={setSelectedEmployeeForDossier}
              />
            )}

            {/* 3. ROLES SELECTOR */}
            {currentView === 'roles' && (
              <RoleSelector
                roles={ROLES}
                tasks={tasks}
                onSelectRole={(roleId) => {
                  setSelectedRoleId(roleId);
                  setCurrentView('workspace');
                }}
                onOpenTrainingSchedule={() => setIsTrainingScheduleOpen(true)}
              />
            )}

            {/* 4. ROLE WORKSPACE */}
            {currentView === 'workspace' && (
              <RoleWorkspace
                role={currentRole}
                roles={ROLES}
                tasks={tasks}
                participants={participants}
                rtoTargets={rtoTargets}
                setRtoTargets={setRtoTargets}
                parentAnxiety={parentAnxiety}
                pulseWeek={pulseWeek}
                setPulseWeek={setPulseWeek}
                startStopContinue={startStopContinue}
                setStartStopContinue={setStartStopContinue}
                reportsConfig={REPORTS_SLA_CONFIG}
                reportsState={reportsState}
                campStartDate={campStartDate}
                onUpdateStatus={handleUpdateTaskStatus}
                onUpdateNote={handleUpdateTaskNote}
                onOpenInstruction={setInstructionTask}
                onOpenArtifact={(data) => setBrandedDocData(getBrandedDocByName(data.artifact || data.name, data.category))}
                onSwitchRole={() => setCurrentView('roles')}
                onOpenTrainingSchedule={() => setIsTrainingScheduleOpen(true)}
                onOpenCheckinModal={setSelectedChildForCheckin}
                onOpenIprGenerator={setSelectedChildForIprGen}
                onOpenIprPrint={setSelectedChildForIprPrint}
                onApproveIpr={handleApproveIpr}
                onOpenReportForm={setSelectedReportForForm}
                onOpenBrandedDoc={(doc) => setBrandedDocData(doc)}
                onOpenChecklists={() => setIsChecklistOpen(true)}
                staffMembers={staffMembers}
                onOpenPostCampReport={() => setIsPostCampReportOpen(true)}
                onOpenEmployeeDossier={setSelectedEmployeeForDossier}
                onApproveReport={handleApproveReport}
                onReturnReport={handleReturnReport}
                onSaveReport={handleSaveReport}
                showToast={showToast}
              />
            )}

            {/* 5. WIKI LIBRARY */}
            {currentView === 'wiki' && (
              <WikiLibrary
                wikiData={WIKI_DATA}
                onOpenCrisisModal={setCrisisData}
                onOpenArtifactModal={(art) => setBrandedDocData(getBrandedDocByName(art.artifact || art.name, art.category, art.description))}
                onOpenBrandedDoc={(doc) => setBrandedDocData(doc)}
                onOpenDetailedManual={setSelectedArtifactForDetailedManual}
              />
            )}
          

            {/* 6. SHIFTS ARCHIVE VIEW (4.2 ПОСТОЯННОЕ ХРАНИЛИЩЕ) */}
            {currentView === 'shifts_archive' && (
              <ShiftsArchiveView
                shiftsArchive={shiftsArchive}
                currentTasks={tasks}
                currentStaffMembers={staffMembers}
                currentReportsState={reportsState}
                onCompleteShiftAndArchive={handleCompleteShiftAndArchive}
                onDeleteArchivedShift={handleDeleteArchivedShift}
                onExportArchiveJson={handleExportArchiveJson}
                onImportArchiveJson={handleImportArchiveJson}
                onOpenPostCampReport={() => setIsPostCampReportOpen(true)}
                onOpenEmployeeDossier={setSelectedEmployeeForDossier}
                showToast={showToast}
              />
            )}

            {/* 7. ADMIN PANEL / Р Р•Р–РРњ РЎРЈРџР•Р РђР”РњРРќРРЎРўР РђРўРћР Рђ */}
            {currentView === 'admin' && (
              <AdminCenterView
                staffMembers={staffMembers}
                setStaffMembers={setStaffMembers}
                onSelectRole={(roleId) => {
                  setSelectedRoleId(roleId);
                  setCurrentView('workspace');
                }}
                roles={ROLES}
                wikiData={WIKI_DATA}
                onOpenDetailedManual={setSelectedArtifactForDetailedManual}
                campStartDate={campStartDate}
                setCampStartDate={setCampStartDate}
                showToast={showToast}
              />
            )}
          </main>


          <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 no-print">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2 font-semibold flex-wrap justify-center">
                <span className="text-red-800 font-black">Жаңа Ұрпақ OS</span>
                <span>·</span>
                <span className="text-amber-700 font-extrabold">Формула 1 + 1 = 11</span>
                <span>·</span>
                <span className="text-slate-600">Дисциплина чести и педагогика сердца</span>
                <span>·</span>
                <span className="text-slate-400">5 «Ж»: Жан · Жүрек · Жеңіл · Жеңіс · Жарық</span>
              </div>
              <div className="font-medium text-slate-400">
                Штаб управления образовательным лагерем © 2026
              </div>
            </div>
          </footer>

          {/* MODALS */}
          {instructionTask && (
            <TaskInstructionModal
              task={instructionTask}
              onClose={() => setInstructionTask(null)}
              onUpdateStatus={handleUpdateTaskStatus}
              onOpenBrandedDoc={(doc) => setBrandedDocData(doc)}
              onOpenDetailedManual={(art) => setSelectedArtifactForDetailedManual(art)}
            />
          )}

          {artifactData && (
            <BrandedDocumentModal
              docData={getBrandedDocByName(artifactData.artifact || artifactData.name, artifactData.category, artifactData.description)}
              onClose={() => setArtifactData(null)}
            />
          )}

          {crisisData && (
            <CrisisModal
              crisis={crisisData}
              onClose={() => setCrisisData(null)}
            />
          )}

          {isTrainingScheduleOpen && (
            <TrainingScheduleModal
              passports={TRAINING_PASSPORTS}
              onClose={() => setIsTrainingScheduleOpen(false)}
              onOpenBrandedDoc={(doc) => setBrandedDocData(doc)}
            />
          )}

          {brandedDocData && (
            <BrandedDocumentModal
              docData={brandedDocData}
              onClose={() => setBrandedDocData(null)}
            />
          )}

          {selectedChildForCheckin && (
            <ParticipantCheckinModal
              child={selectedChildForCheckin}
              onClose={() => setSelectedChildForCheckin(null)}
              onSaveCheckin={handleSaveCheckin}
            />
          )}

          {selectedChildForIprGen && (
            <IprGeneratorModal
              child={selectedChildForIprGen}
              onClose={() => setSelectedChildForIprGen(null)}
              onSaveIpr={handleSaveIprData}
              onSubmitForReview={handleSubmitIprForReview}
            />
          )}

          {selectedChildForIprPrint && (
            <BrandedIprPrintModal
              child={selectedChildForIprPrint}
              onClose={() => setSelectedChildForIprPrint(null)}
            />
          )}

          {selectedReportForForm && (
            <UpgradedReportFormModal
              report={selectedReportForForm}
              currentRoleId={selectedRoleId}
              currentState={reportsState[selectedReportForForm.id]}
              onClose={() => setSelectedReportForForm(null)}
              onSaveReport={handleSaveReport}
              onOpenBrandedDoc={(doc) => setBrandedDocData(doc)}
            />
          )}

          {isChecklistOpen && (
            <PrintableChecklistModal
              roles={ROLES}
              tasks={tasks}
              currentRoleId={selectedRoleId}
              campStartDate={campStartDate}
              onClose={() => setIsChecklistOpen(false)}
            />
          )}

          {selectedEmployeeForDossier && (
            <EmployeeDossierModal
              employee={selectedEmployeeForDossier}
              onClose={() => setSelectedEmployeeForDossier(null)}
              onSelectRole={(rId) => {
                setSelectedRoleId(rId);
                setCurrentView('workspace');
              }}
            />
          )}

          {selectedArtifactForDetailedManual && (
            <DetailedManualModal
              artifact={selectedArtifactForDetailedManual}
              onClose={() => setSelectedArtifactForDetailedManual(null)}
            />
          )}

          {isPostCampReportOpen && (
            <PostCampMasterReportModal
              staffMembers={staffMembers}
              tasks={tasks}
              campStartDate={campStartDate}
              onClose={() => setIsPostCampReportOpen(false)}
            />
          )}

          {isPlaceholdersOpen && (
            <PlaceholdersRegistryModal
              placeholders={PLACEHOLDERS_CATALOG}
              onClose={() => setIsPlaceholdersOpen(false)}
            />
          )}

          {isExportOpen && (
            <ExportModal
              tasks={tasks}
              participants={participants}
              reportsState={reportsState}
              rtoTargets={rtoTargets}
              onResetTasks={handleResetTasks}
              onImportData={handleImportData}
              onDownloadBackup={handleDownloadBackupHtml}
              onClose={() => setIsExportOpen(false)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
